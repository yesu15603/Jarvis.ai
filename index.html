<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.A.R.V.I.S</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>

      <div class="brand">
        <div class="logo">J</div>

        <div>
          <h1>J.A.R.V.I.S</h1>
          <p>MOBILE EDITION</p>
        </div>
      </div>

      <div class="status">
        <span></span>
        ONLINE
      </div>

    </header>


    <section class="reactor-section">

      <div class="reactor">

        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>

        <div class="core">
          <span>J</span>
        </div>

      </div>

      <h2>CORE ACTIVE</h2>
      <p>J.A.R.V.I.S ARTIFICIAL INTELLIGENCE</p>

    </section>


    <div class="systems">

      <div class="system-card">
        <span>🧠</span>
        <div>
          <strong>AI CORE</strong>
          <small>ONLINE</small>
        </div>
      </div>

      <div class="system-card">
        <span>🌐</span>
        <div>
          <strong>NETWORK</strong>
          <small>ONLINE</small>
        </div>
      </div>

      <div class="system-card">
        <span>🎙️</span>
        <div>
          <strong>VOICE</strong>
          <small>READY</small>
        </div>
      </div>

    </div>


    <div class="chat-section">

      <div class="section-title">
        <span>SYSTEM COMMUNICATION</span>
        <span class="live">● LIVE</span>
      </div>

      <div class="chat" id="chat"></div>

      <div class="input-area">

        <input
          id="msg"
          type="text"
          placeholder="Ask J.A.R.V.I.S..."
        >

        <button id="send">➤</button>

        <button id="mic-btn">🎙️</button>

      </div>

    </div>


    <footer>
      J.A.R.V.I.S • ARTIFICIAL INTELLIGENCE SYSTEM
    </footer>

  </div>


  <script src="script.js"></script>

</body>
</html>
